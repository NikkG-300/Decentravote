<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecentraVote - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>DecentraVote</h1>
        <p class="subtitle">Secure Voting System</p>
        
        <div class="form-card">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <div id="error" class="error"></div>
            </form>
        </div>

        <div class="form-card">
            <h2>Register</h2>
            <form id="registerForm">
                <input type="text" id="reg_username" placeholder="Username" required>
                <input type="password" id="reg_password" placeholder="Password" required>
                <select id="reg_role">
                    <option value="voter">Voter</option>
                    <option value="admin">Admin</option>
                </select>
                <button type="submit">Register</button>
                <div id="reg_error" class="error"></div>
            </form>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    document.getElementById('error').textContent = data.error;
                    return;
                }
                
                localStorage.setItem('user', JSON.stringify(data));
                
                if (data.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'voter.html';
                }
            } catch (err) {
                document.getElementById('error').textContent = 'Connection error';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg_username').value;
            const password = document.getElementById('reg_password').value;
            const role = document.getElementById('reg_role').value;
            
            try {
                const res = await fetch(`${API}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    document.getElementById('reg_error').textContent = data.error;
                    return;
                }
                
                alert('Registration successful! Please login.');
                document.getElementById('registerForm').reset();
            } catch (err) {
                document.getElementById('reg_error').textContent = 'Connection error';
            }
        });
    </script>
</body>
</html>
