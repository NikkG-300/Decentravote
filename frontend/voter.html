<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Voter Dashboard</h1>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="form-card">
            <h2>Active Elections</h2>
            <div id="elections"></div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api';
        const user = JSON.parse(localStorage.getItem('user'));

        if (!user || user.role !== 'voter') {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        async function loadElections() {
            const res = await fetch(`${API}/elections`);
            const elections = await res.json();
            
            const container = document.getElementById('elections');
            container.innerHTML = '';
            
            for (const election of elections) {
                if (election.status !== 'active') continue;
                
                const checkRes = await fetch(`${API}/check-vote/${election.id}/${user.id}`);
                const { hasVoted } = await checkRes.json();
                
                const candRes = await fetch(`${API}/elections/${election.id}/candidates`);
                const candidates = await candRes.json();
                
                const div = document.createElement('div');
                div.className = 'election-item';
                div.innerHTML = `
                    <h3>${election.title}</h3>
                    <p>${election.description || ''}</p>
                    ${hasVoted ? '<p class="voted">✓ You have voted</p>' : ''}
                    <div class="candidates" id="cand-${election.id}"></div>
                    <a href="results.html?id=${election.id}">View Results</a>
                `;
                container.appendChild(div);
                
                const candContainer = document.getElementById(`cand-${election.id}`);
                
                candidates.forEach(c => {
                    const btn = document.createElement('button');
                    btn.textContent = `Vote for ${c.name}`;
                    btn.disabled = hasVoted;
                    btn.onclick = () => vote(election.id, c.id);
                    candContainer.appendChild(btn);
                });
            }
        }

        async function vote(election_id, candidate_id) {
            if (!confirm('Confirm your vote?')) return;
            
            try {
                const res = await fetch(`${API}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ election_id, candidate_id, voter_id: user.id })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    alert(data.error);
                    return;
                }
                
                alert('Vote recorded successfully!');
                loadElections();
            } catch (err) {
                alert('Error recording vote');
            }
        }

        loadElections();
    </script>
</body>
</html>
